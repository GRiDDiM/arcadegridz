name: Windows app
on:
  push:
    paths: ["windows/ArcadeGridz.Windows/**", ".github/workflows/arcadegridz-windows.yml"]
  pull_request:
    paths: ["windows/ArcadeGridz.Windows/**", ".github/workflows/arcadegridz-windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows/ArcadeGridz.Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: microsoft/setup-msbuild@v2
      - name: Generate Windows icon from official favicon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ArcadeGridz.App/Assets | Out-Null
          Invoke-WebRequest https://arcadegridz.com/assets/favicon_arcadegridz_090826.png -OutFile ArcadeGridz.App/Assets/favicon.png
          $actual = (Get-FileHash ArcadeGridz.App/Assets/favicon.png -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "d71dcc6a80734f409e7833c21b5e6a9a517252277df5652f9ad7b2ffea60a4cf") { throw "Official favicon hash changed: $actual" }
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open(r'ArcadeGridz.App/Assets/favicon.png').convert('RGBA'); im.save(r'ArcadeGridz.App/Assets/ArcadeGridz.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - run: msbuild ArcadeGridz.App/ArcadeGridz.App.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=${{ github.workspace }}\\windows\\ArcadeGridz.Windows\\publish\\ArcadeGridz\\
      - name: Validate unpackaged runtime payload
        shell: pwsh
        run: |
          $required = @(
            "ArcadeGridz.App.exe",
            "ArcadeGridz.App.dll",
            "App.xbf",
            "MainWindow.xbf",
            "Assets/ArcadeGridz.ico",
            "Microsoft.WindowsAppRuntime.dll",
            "WebView2Loader.dll"
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path "publish/ArcadeGridz" $file))) { throw "Missing required runtime file: $file" }
          }
      - name: Smoke-test native launcher startup
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "ArcadeGridz/logs/startup.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath (Resolve-Path "publish/ArcadeGridz/ArcadeGridz.App.exe") -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                $content = if (Test-Path $log) { Get-Content $log -Raw } else { "<startup log missing>" }
                throw ("Launcher exited during startup with $($process.ExitCode). Log: " + [Environment]::NewLine + $content)
              }
              $content = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
            } until ($content -match "Launcher ready" -or (Get-Date) -gt $deadline)
            if ($content -notmatch "Launcher ready") { throw ("Launcher did not reach ready state. Log: " + [Environment]::NewLine + $content) }
            Write-Host $content
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Show WinUI compiler diagnostics
        if: failure()
        shell: pwsh
        run: Get-ChildItem ArcadeGridz.App/obj -Filter output.json -Recurse | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName }
      - name: Verify live launcher catalog
        shell: pwsh
        run: |
          $catalog = Invoke-RestMethod https://arcadegridz.com/api/launcher/catalog
          if (-not $catalog.ok) { throw "Catalog returned ok=false" }
          if (-not ($catalog.games.id -contains "2diso")) { throw "2DISO missing from catalog" }
          if (-not ($catalog.games.id -contains "pixel-sickness")) { throw "Pixel Sickness missing from catalog" }
          Write-Host "Catalog $($catalog.version): $($catalog.games.Count) games"
      - name: Add installation guide
        shell: pwsh
        run: Copy-Item README.md publish/ArcadeGridz/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeGridz-win-x64
          path: windows/ArcadeGridz.Windows/publish/ArcadeGridz/
