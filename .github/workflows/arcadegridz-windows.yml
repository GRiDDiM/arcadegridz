name: Windows app
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
    paths: ["windows/ArcadeGridz.Windows/**", ".github/workflows/arcadegridz-windows.yml"]
  pull_request:
    paths: ["windows/ArcadeGridz.Windows/**", ".github/workflows/arcadegridz-windows.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows/ArcadeGridz.Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: microsoft/setup-msbuild@v2
      - name: Generate Windows icon from official favicon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ArcadeGridz.App/Assets | Out-Null
          Invoke-WebRequest https://arcadegridz.com/assets/favicon_arcadegridz_090826.png -OutFile ArcadeGridz.App/Assets/favicon.png
          $actual = (Get-FileHash ArcadeGridz.App/Assets/favicon.png -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "d71dcc6a80734f409e7833c21b5e6a9a517252277df5652f9ad7b2ffea60a4cf") { throw "Official favicon hash changed: $actual" }
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open(r'ArcadeGridz.App/Assets/favicon.png').convert('RGBA'); im.save(r'ArcadeGridz.App/Assets/ArcadeGridz.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Fetch launcher brand art and fonts (hash-pinned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ArcadeGridz.App/Assets/Fonts | Out-Null
          $fonts = "https://raw.githubusercontent.com/google/fonts/6c1dbe27dcf7d817d4b62cec033ba77fa8e2a5ec/ofl"
          $assets = @(
            @{ Url = "https://arcadegridz.com/assets/arcadegridz-logo-header.png"; Out = "ArcadeGridz.App/Assets/arcadegridz-logo.png"; Sha = "80afb67e42ffdb8122bef08a497410027e73e05ab0ba12e69caa4488ac5865ff" },
            @{ Url = "https://arcadegridz.com/assets/arcadegridz-80s-hall.jpg"; Out = "ArcadeGridz.App/Assets/arcadegridz-hall.jpg"; Sha = "3f86929bc0f453c7a752cef1edccda1d0fd7b706069158f570350ceb3cd062da" },
            @{ Url = "$fonts/bungee/Bungee-Regular.ttf"; Out = "ArcadeGridz.App/Assets/Fonts/Bungee-Regular.ttf"; Sha = "c4f5361ce120af3e6b9156d0bf379fa19cda2ea0cd18ac01fd99596c6bf66e3f" },
            @{ Url = "$fonts/bungee/OFL.txt"; Out = "ArcadeGridz.App/Assets/Fonts/Bungee-OFL.txt"; Sha = "d5787a50dde5be6c6daecab9ed459939b1bc37cff0d0e00257eaf1ec2cf4c16c" },
            @{ Url = "$fonts/pressstart2p/PressStart2P-Regular.ttf"; Out = "ArcadeGridz.App/Assets/Fonts/PressStart2P-Regular.ttf"; Sha = "034c77f1f05ec89421e4a63f0e3a4ca1ecf852cc6d2bf611f126f275728e017d" },
            @{ Url = "$fonts/pressstart2p/OFL.txt"; Out = "ArcadeGridz.App/Assets/Fonts/PressStart2P-OFL.txt"; Sha = "705960c3281a5765ecc0b59bd4ed7ca59eed165748076bc2fc3e8fdbfeb944b0" }
          )
          foreach ($a in $assets) {
            Invoke-WebRequest $a.Url -OutFile $a.Out
            $actual = (Get-FileHash $a.Out -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $a.Sha) { throw "Asset hash changed for $($a.Url): $actual" }
          }
      - name: Publish self-contained WinUI app
        run: msbuild ArcadeGridz.App/ArcadeGridz.App.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=${{ github.workspace }}\\windows\\ArcadeGridz.Windows\\publish\\ArcadeGridz\\
      - name: Validate unpackaged runtime payload
        shell: pwsh
        run: |
          $required = @("ArcadeGridz.App.exe", "ArcadeGridz.App.dll", "App.xbf", "MainWindow.xbf", "resources.pri", "Assets/ArcadeGridz.ico", "Assets/arcadegridz-logo.png", "Assets/arcadegridz-hall.jpg", "Assets/scanlines.png", "Assets/Fonts/Bungee-Regular.ttf", "Assets/Fonts/PressStart2P-Regular.ttf", "Microsoft.WindowsAppRuntime.dll", "WebView2Loader.dll")
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path "publish/ArcadeGridz" $file))) { throw "Missing required runtime file: $file" }
          }
      - name: Smoke-test native launcher startup
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "ArcadeGridz/logs/startup.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath (Resolve-Path "publish/ArcadeGridz/ArcadeGridz.App.exe") -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                $content = if (Test-Path $log) { Get-Content $log -Raw } else { "<startup log missing>" }
                throw ("Launcher exited during startup with $($process.ExitCode). Log: " + [Environment]::NewLine + $content)
              }
              $content = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
            } until ($content -match "Launcher ready" -or (Get-Date) -gt $deadline)
            if ($content -notmatch "Launcher ready") { throw ("Launcher did not reach ready state. Log: " + [Environment]::NewLine + $content) }
            Write-Host $content
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Verify live launcher catalog
        shell: pwsh
        run: |
          $catalog = Invoke-RestMethod https://arcadegridz.com/api/launcher/catalog
          if (-not $catalog.ok) { throw "Catalog returned ok=false" }
          if (-not ($catalog.games.id -contains "2diso")) { throw "2DISO missing from catalog" }
          if (-not ($catalog.games.id -contains "pixel-sickness")) { throw "Pixel Sickness missing from catalog" }
          Write-Host "Catalog $($catalog.version): $($catalog.games.Count) games"
      - name: Add installation guide
        shell: pwsh
        run: Copy-Item README.md publish/ArcadeGridz/README.txt
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: |
          [xml]$project = Get-Content ArcadeGridz.App/ArcadeGridz.App.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match app version v$version" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" Installer/ArcadeGridz.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
      - name: Generate update manifest
        id: update_metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content ArcadeGridz.App/ArcadeGridz.App.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          $installer = Resolve-Path publish/installer/ArcadeGridz-Setup-x64.exe
          $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            version = $version
            installerUrl = "https://github.com/GRiDDiM/arcadegridz/releases/download/v$version/ArcadeGridz-Setup-x64.exe"
            sha256 = $sha256
            minimumOsBuild = 17763
          }
          $manifest | ConvertTo-Json | Set-Content publish/installer/update-manifest.json -Encoding utf8NoBOM
          Write-Host "Installer SHA-256: $sha256"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Validate installer and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "ArcadeGridzInstall"
          $installer = Resolve-Path publish/installer/ArcadeGridz-Setup-x64.exe
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOLAUNCH", "/DIR=$installDir" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          foreach ($file in @("ArcadeGridz.App.exe", "App.xbf", "MainWindow.xbf", "resources.pri", "Assets/ArcadeGridz.ico")) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Installed payload is missing $file" }
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstall = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
      - name: Show WinUI compiler diagnostics
        if: failure()
        shell: pwsh
        run: Get-ChildItem ArcadeGridz.App/obj -Filter output.json -Recurse | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeGridz-Setup-x64
          path: |
            windows/ArcadeGridz.Windows/publish/installer/ArcadeGridz-Setup-x64.exe
            windows/ArcadeGridz.Windows/publish/installer/update-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeGridz-win-x64-portable
          path: windows/ArcadeGridz.Windows/publish/ArcadeGridz/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.update_metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            windows/ArcadeGridz.Windows/publish/installer/ArcadeGridz-Setup-x64.exe
            windows/ArcadeGridz.Windows/publish/installer/update-manifest.json
